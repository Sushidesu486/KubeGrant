apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubegrant
resources:
  - ../k8s
  - rbac.yaml
  - admission.yaml
  - networkpolicy.yaml
patches:
  - target:
      kind: Namespace
      name: kubegrant
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-5"
  - target:
      kind: ConfigMap
      name: kubegrant-signing-policy
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-4"
  - target:
      kind: ValidatingAdmissionPolicy|ValidatingAdmissionPolicyBinding
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-3"
  - target:
      kind: ServiceAccount|ClusterRole|ClusterRoleBinding|Role|RoleBinding
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-2"
  - target:
      kind: NetworkPolicy
      name: kubegrant-kubernetes-api
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-2"
  - path: workload.yaml
  - target:
      kind: ConfigMap
      name: kubegrant-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: kubegrant-config
      data:
        KUBEGRANT_SIGNING_ENABLED: "true"
        KUBEGRANT_CLUSTER_ENDPOINT: https://k8s-api.clusters.zjusct.io:6444
        KUBEGRANT_CLUSTER_CA_FILE: /etc/kubegrant/cluster/ca.crt
        KUBEGRANT_KUBERNETES_API: https://kubernetes.default.svc
