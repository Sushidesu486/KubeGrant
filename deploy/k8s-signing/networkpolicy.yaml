apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kubegrant-kubernetes-api
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kubegrant
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
