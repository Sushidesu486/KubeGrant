apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubegrant-kubernetes-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubegrant
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 172.27.0.1/32
        - ipBlock:
            cidr: 172.25.4.11/32
        - ipBlock:
            cidr: 172.25.4.60/32
        - ipBlock:
            cidr: 172.25.4.61/32
        - ipBlock:
            cidr: 172.25.4.66/32
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
