apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubegrant
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubegrant
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: freeipa
      ports:
        - protocol: TCP
          port: 636
