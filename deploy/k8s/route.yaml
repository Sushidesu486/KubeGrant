apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubegrant
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: https-wildcard-clusters-zjusct-io
  hostnames:
    - kubegrant.clusters.zjusct.io
  rules:
    - backendRefs:
        - name: kubegrant
          port: 80
