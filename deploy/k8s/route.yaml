apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubegrant
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
  hostnames:
    - kubegrant.clusters.zjusct.io
  rules:
    - timeouts:
        request: 30s
        backendRequest: 25s
      backendRefs:
        - name: kubegrant
          port: 80
