apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubegrant
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: kubegrant
spec:
  selector:
    app.kubernetes.io/name: kubegrant
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: kubegrant-headless
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: kubegrant
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kubegrant
spec:
  serviceName: kubegrant-headless
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: kubegrant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubegrant
    spec:
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      serviceAccountName: kubegrant
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-pull
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubegrant
          image: kubegrant:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: kubegrant-config
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
              ephemeral-storage: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: ipa-ca
              mountPath: /etc/kubegrant/ipa
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: ipa-ca
          configMap:
            name: kubegrant-ipa-ca
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: ceph-block
        accessModes: [ReadWriteOncePod]
        resources:
          requests:
            storage: 2Gi
